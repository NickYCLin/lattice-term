[package]
name = "lattice-term"
version = "1.3.0"
description = "A secure, cross-platform workspace for local AI CLIs, SSH, SFTP, RDP, and remote desktop access."
authors = ["NickYCLin"]
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/NickYCLin/lattice-term"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "latticeterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# `ring` instead of the default aws-lc-rs backend: aws-lc-sys needs NASM and a
# C toolchain on Windows, and complicates Android/iOS cross-compilation.
russh = { version = "0.63.1", default-features = false, features = ["ring", "flate2", "rsa"] }
# `reqwest` is pulled in by Tauri without selecting a process-wide provider.
# Install the same `ring` backend before any Tauri HTTP client is constructed.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
russh-sftp = "2.4.0"
sha2 = "0.11.0"
base64 = "0.23.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time", "process", "signal"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
lattice-remote = { path = "../crates/lattice-remote" }
keyring = "4.1.6"
zeroize = "1.9.0"
portable-pty = "0.9.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
getrandom = "0.4.3"
argon2 = "0.6"
chacha20poly1305 = "0.11.0"
tempfile = "3.27.0"
png = "0.18.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
tauri-plugin-single-instance = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-clipboard-manager = "2.3.2"

[target.'cfg(target_os = "ios")'.dependencies]
# `keyring` selects the Apple-native provider on iOS. The provider has no
# default feature, but iOS only exposes the protected-data store.
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

# GTK3 permanently depends on glib 0.18, while the upstream safety fix for
# RUSTSEC-2024-0429 was released only with glib 0.20. Keep the compatible crate
# local and apply the upstream one-line fix until Tauri moves away from GTK3.
[patch.crates-io]
glib = { path = "../vendor/glib-0.18.5" }
