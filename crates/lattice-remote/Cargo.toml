[package]
name = "lattice-remote"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Encrypted direct-connect protocol and agent for Lattice Remote"

[features]
default = []
agent = ["dep:enigo", "dep:image", "dep:portable-pty", "dep:xcap"]
client-cli = ["dep:clap", "dep:crossterm", "dep:dirs", "dep:rpassword", "tokio/io-std"]
relay-server = []

[dependencies]
base64 = "0.22"
sha2 = "0.11.0"
snow = "0.10.0"
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255", "argon2"] }
rand = "0.8"
hkdf = "0.12"
# opaque-ke uses digest 0.10; keep its suite separate from the existing hashes.
sha2-opaque = { package = "sha2", version = "0.10" }
getrandom = "0.4.3"
thiserror = "2"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time", "process"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# tokio-tungstenite pulls rustls without choosing a crypto provider. Pick ring
# explicitly so wss:// works consistently in desktop and sidecar processes.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"], optional = true }
crossterm = { version = "0.29", optional = true }
dirs = { version = "6", optional = true }
fs2 = "0.4"
rpassword = { version = "7", optional = true }
tempfile = "3.27"
zeroize = "1.9"
# xcap 0.5+ uses pipewire-rs APIs newer than Ubuntu 22.04 headers.
xcap = { version = "=0.4.1", optional = true }
enigo = { version = "0.6", optional = true }
# Terminal mode shares a PTY shell instead of the display; same crate the
# desktop app already uses for local CLIs.
portable-pty = { version = "0.9", optional = true }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[[bin]]
name = "lattice-agent"
path = "src/bin/lattice-agent.rs"
required-features = ["agent"]

[[bin]]
name = "lattice-relay"
path = "src/bin/lattice-relay.rs"
required-features = ["relay-server"]

[[bin]]
name = "lattice-remote"
path = "src/bin/lattice-remote.rs"
required-features = ["client-cli"]
