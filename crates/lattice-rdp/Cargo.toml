[package]
name = "lattice-rdp"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Isolated native RDP engine for LatticeTerm"

[[bin]]
name = "lattice-rdp-engine"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ironrdp = { git = "https://github.com/Devolutions/IronRDP", rev = "476b897129634c7f39d5679a80265258d506c1d3", default-features = false, features = ["client", "rustls", "input", "pdu", "core", "svc", "rdpdr", "client-rdpdr"] }
ironrdp-tls = { git = "https://github.com/Devolutions/IronRDP", rev = "476b897129634c7f39d5679a80265258d506c1d3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1.53", features = ["io-util", "io-std", "macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
ironrdp-rdpdr-native = { git = "https://github.com/Devolutions/IronRDP", rev = "476b897129634c7f39d5679a80265258d506c1d3" }

[dev-dependencies]
tempfile = "3"

[patch."https://github.com/Devolutions/IronRDP"]
ironrdp-rdpdr = { path = "../../vendor/ironrdp-rdpdr" }
