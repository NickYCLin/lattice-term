name: Release

on:
  push:
    branches: [main]
  # Release Please only opens the PR; something has to merge it or nothing
  # ever ships. Every push to main re-checks whether enough work has
  # accumulated and publishes the moment it has — see
  # scripts/decide-release.mjs for what "enough" means.
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Publish the pending Release PR even below the accumulation
          threshold. This is the maintainer decision the release policy
          reserves for urgent fixes; it still refuses a version whose
          changelog would hold nothing for the user.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Plan or publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # A release can be cut by either pass: the first when a human merged the
    # Release PR, the second when this run merged it itself.
    outputs:
      release_created: ${{ steps.release.outputs.release_created == 'true' && 'true' || steps.publish.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.release_created == 'true' && steps.release.outputs.tag_name || steps.publish.outputs.tag_name }}
      sha: ${{ steps.release.outputs.release_created == 'true' && steps.release.outputs.sha || steps.publish.outputs.sha }}

    steps:
      - name: Create or update the Release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resolve the generated Release PR branch
        if: steps.release.outputs.prs_created == 'true'
        id: release-pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        with:
          result-encoding: string
          script: |
            return JSON.parse(process.env.RELEASE_PR).headBranchName;

      # Cargo.lock is generated and strips custom version annotations. Also,
      # merge commits may duplicate their child commit in the generated
      # changelog. Normalize both files on the generated Release PR.
      - name: Check out the generated Release PR
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release-pr.outputs.result }}
          fetch-depth: 0

      - name: Normalize the generated release files
        if: steps.release.outputs.prs_created == 'true'
        shell: bash
        run: |
          npm run release:normalize-changelog
          npm run version:sync-lock
          node scripts/check-version-sync.mjs
          if git diff --quiet -- CHANGELOG.md src-tauri/Cargo.lock; then
            echo "Release files are already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CHANGELOG.md src-tauri/Cargo.lock
          git commit -m "chore(版本): 正規化版本檔案"
          git push origin "HEAD:${{ steps.release-pr.outputs.result }}"

      # Each source commit has already passed the single-runner CI. The steps
      # above validate generated version files, so the Release PR does not
      # dispatch another copy of the source CI.

      # Deciding needs the tags and the commits since the last one, which the
      # Release PR branch checked out above does not describe.
      - name: Check out main for the release decision
        if: steps.release.outputs.release_created != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether the pending release is due
        if: steps.release.outputs.release_created != 'true'
        id: due
        env:
          RELEASE_FORCE: ${{ inputs.force }}
        run: node scripts/decide-release.mjs

      - name: Find the pending Release PR
        if: steps.due.outputs.release == 'true'
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number="$(gh pr list --state open --label 'autorelease: pending' \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].number // empty')"
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          if [ -z "$number" ]; then
            echo "No pending Release PR to publish."
          else
            echo "Publishing Release PR #${number}: ${{ steps.due.outputs.reason }}"
          fi

      # The PR is opened as a draft so a human decides; publishing it here is
      # that decision, made by the rule instead.
      - name: Publish the pending Release PR
        if: steps.pending.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number="${{ steps.pending.outputs.number }}"
          # Already-ready is not a failure: a human may have marked it.
          gh pr ready "$number" || true
          gh pr merge "$number" --squash --delete-branch
          # The next step asks Release Please to cut the tag, which only works
          # once GitHub reports the merge, so wait for it rather than racing.
          for _ in $(seq 1 30); do
            state="$(gh pr view "$number" --json state --jq .state)"
            [ "$state" = "MERGED" ] && exit 0
            sleep 2
          done
          echo "Release PR #${number} did not reach MERGED in time." >&2
          exit 1

      # A merge made with GITHUB_TOKEN does not start another workflow run, so
      # the tag and GitHub Release have to be cut here rather than waiting for
      # a push event that will never arrive.
      - name: Cut the release for the PR just published
        if: steps.pending.outputs.number != ''
        id: publish
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    name: Build & upload (${{ matrix.name }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            platform: ubuntu-22.04
          - name: Linux arm64
            platform: ubuntu-22.04-arm
          - name: Windows amd64
            platform: windows-latest
          - name: macOS arm64
            platform: macos-latest
          - name: macOS Intel
            platform: macos-15-intel

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Install Linux desktop dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Configure Linux bindgen
        if: startsWith(matrix.platform, 'ubuntu-')
        shell: bash
        run: echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include)" >> "$GITHUB_ENV"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri -> target
            crates/lattice-remote -> target
            crates/lattice-rdp -> target
            crates/lattice-vnc -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify released source
        run: npm run check

      - name: Check the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set."
            echo "Unsigned updater artifacts would be refused by installed clients."
            exit 1
          fi
          echo "Updater signing key is present."

      - name: Build and upload signed installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.release-please.outputs.tag_name }}
          # The release stays a draft while installers upload; the publish job
          # below flips it live only when every platform finished. Publishing
          # first would leave a window where installed apps see a "latest"
          # release whose latest.json does not exist yet.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          retryAttempts: 2

  # The Android APK is built and attached independently: it must never block the
  # desktop release from going live, and it self-skips until the signing secrets
  # (ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) are set.
  build-android:
    name: Build & upload (Android APK)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Decide whether a signing key is available
        id: gate
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret set; skipping the Android build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux desktop dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config libclang-dev

      - name: Set up Java
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.gate.outputs.enabled == 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install the Android NDK
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sdkmanager "ndk;27.1.12297006"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Set up Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust with Android targets
        if: steps.gate.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: npm ci

      - name: Write the signing keystore
        if: steps.gate.outputs.enabled == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri/gen/android
          echo "$KEYSTORE" | base64 -d > keystore.jks
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "password=$KEY_PASSWORD"
            echo "storeFile=keystore.jks"
          } > keystore.properties

      - name: Build the signed APK
        if: steps.gate.outputs.enabled == 'true'
        run: npx tauri android build --apk

      - name: Attach the APK to the release
        if: steps.gate.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-release.apk" ! -name "*-unsigned.apk" | head -n1)
          if [ -z "$apk" ]; then
            echo "No signed APK was produced." >&2
            exit 1
          fi
          cp "$apk" "LatticeTerm_${version}_android.apk"
          gh release upload "$TAG_NAME" "LatticeTerm_${version}_android.apk" --clobber

  publish-release:
    name: Publish the finished release
    needs: [release-please, build-release]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Render the Traditional Chinese release notes
        shell: bash
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: node scripts/render-release-metadata.mjs "$TAG_NAME" "$RUNNER_TEMP/release-metadata.json"

      - name: Synchronize the updater release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/updater"
          gh release download "$TAG_NAME" --pattern latest.json --dir "$RUNNER_TEMP/updater"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" > "$RUNNER_TEMP/updater/release.json"
          node scripts/validate-updater-manifest.mjs "$RUNNER_TEMP/updater/latest.json" "$RUNNER_TEMP/updater/release.json" "$TAG_NAME"
          node scripts/sync-updater-release-notes.mjs "$RUNNER_TEMP/updater/latest.json" "$RUNNER_TEMP/release-metadata.json"
          gh release upload "$TAG_NAME" "$RUNNER_TEMP/updater/latest.json" --clobber

      - name: Apply the release notes and flip the draft live
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_METADATA_PATH: ${{ runner.temp }}/release-metadata.json
        with:
          script: |
            const fs = require("node:fs");
            const tag = process.env.TAG_NAME;
            const metadata = JSON.parse(
              fs.readFileSync(process.env.RELEASE_METADATA_PATH, "utf8"),
            );
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 30,
            });
            const release = releases.data.find((entry) => entry.tag_name === tag);
            if (!release) throw new Error(`No release found for ${tag}`);
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: metadata.name,
              body: metadata.body,
              draft: false,
              make_latest: "true",
            });
            core.info(`Published ${tag} with normalized release notes.`);
