name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Immutable release candidate commit to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-remote-text-macos:
    name: macOS remote text safety
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/lattice-remote -> target
      - name: Verify native text file safety and encrypted editing
        run: |
          cargo test --manifest-path crates/lattice-remote/Cargo.toml --features agent --lib
          cargo test --manifest-path crates/lattice-remote/Cargo.toml --features agent --bin lattice-agent text_editor
          cargo build --manifest-path crates/lattice-remote/Cargo.toml --features agent --bin lattice-agent
          cargo test --manifest-path crates/lattice-remote/Cargo.toml --features agent --test text_files_e2e -- --ignored
          cargo clippy --manifest-path crates/lattice-remote/Cargo.toml --features agent --all-targets -- -D warnings

  # Linux validates the full desktop source; macOS separately checks native
  # text-file safety. Release packages are built after Release Please publishes.
  verify:
    name: Linux quick check
    if: "${{ inputs.ref != '' || github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(main): 發布 ') }}"
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev bubblewrap openssh-sftp-server

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Verify Conventional Commits
        if: github.event_name == 'pull_request'
        run: node .github/scripts/check-conventional-commits.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt

      - name: Configure Linux bindgen
        shell: bash
        run: echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include)" >> "$GITHUB_ENV"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri -> target
            crates/lattice-remote -> target
            crates/lattice-rdp -> target
            crates/lattice-vnc -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run check

      # Tauri's Rust build script validates configured external binaries even
      # during cargo test, so the debug sidecars must exist first.
      - name: Build desktop sidecars
        run: npm run build:sidecars

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo fmt --manifest-path crates/lattice-remote/Cargo.toml --check
          cargo fmt --manifest-path crates/lattice-rdp/Cargo.toml --check
          cargo fmt --manifest-path crates/lattice-vnc/Cargo.toml --check

      - name: Test Rust
        env:
          LATTICETERM_REQUIRE_SANDBOX_TEST: "1"
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          # Exercises the optimized code path affected by RUSTSEC-2024-0429.
          cargo test --manifest-path vendor/glib-0.18.5/Cargo.toml --release variant_iter::tests
          cargo test --manifest-path crates/lattice-remote/Cargo.toml --features "agent client-cli relay-server"
          cargo test --manifest-path crates/lattice-rdp/Cargo.toml
          cargo test --manifest-path crates/lattice-vnc/Cargo.toml

      - name: Verify SFTP against the real OpenSSH subsystem
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib openssh_ -- --ignored

      - name: Verify remote text over a real encrypted headless connection
        run: cargo test --manifest-path crates/lattice-remote/Cargo.toml --features agent --test text_files_e2e -- --ignored

      - name: Lint Rust
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/lattice-remote/Cargo.toml --features "agent client-cli relay-server" --all-targets -- -D warnings
          cargo clippy --manifest-path crates/lattice-rdp/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/lattice-vnc/Cargo.toml --all-targets -- -D warnings
