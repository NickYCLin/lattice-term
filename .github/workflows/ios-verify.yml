name: iOS verification

on:
  workflow_dispatch:
    inputs:
      native_interactions:
        description: '執行三機真實鍵盤、旋轉與表單互動驗收'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "crates/lattice-remote/**"
      - "scripts/*ios*"
      - "scripts/ios-layout-ui-tests/**"
      - "package*.json"
      - ".github/workflows/ios-verify.yml"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "crates/lattice-remote/**"
      - "scripts/*ios*"
      - "scripts/ios-layout-ui-tests/**"
      - "package*.json"
      - ".github/workflows/ios-verify.yml"

permissions:
  contents: read

concurrency:
  group: ios-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: iOS Release bundles (no signing)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: ios-simulator
      - name: Select an installed Xcode 26 or newer
        shell: bash
        run: |
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          candidates = []
          for app in Path('/Applications').glob('Xcode*.app'):
              match = re.match(r'Xcode_(\d+)(?:\.(\d+))?(?:\.(\d+))?\.app$', app.name)
              if match and int(match[1]) >= 26:
                  candidates.append((tuple(int(part or 0) for part in match.groups()), app))
          if not candidates:
              raise SystemExit('Runner has no supported Xcode 26 installation')
          subprocess.run(['sudo', 'xcode-select', '-s', str(max(candidates)[1])], check=True)
          PY
          xcodebuild -version
      - run: npm ci
      - run: npm run ios:check
      - run: python3 scripts/test_verify_ios_app.py
      - run: python3 scripts/test_ios_simulator_smoke.py
      - name: Build the simulator app with bundled frontend assets
        run: npm run ios:simulator:release
      - name: Check the built bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          apps = list(Path('src-tauri/gen/apple/build').glob('*/LatticeTerm.app'))
          if len(apps) != 1:
              raise SystemExit(f'Expected one simulator app, found {len(apps)}')
          result = subprocess.run(['python3', 'scripts/verify-ios-app.py', str(apps[0]), '--build-number', '1', '--require-declared-api'], check=True, stdout=subprocess.PIPE, text=True)
          print(result.stdout)
          reports = Path('src-tauri/gen/apple/build/reports')
          reports.mkdir(exist_ok=True)
          (reports / 'simulator.json').write_text(result.stdout)
          PY
      - name: Build an unsigned device archive
        run: npm run ios:device:unsigned
      - name: Check the device SDK and bundled privacy declarations
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          apps = list(Path('src-tauri/gen/apple/build').glob('*.xcarchive/Products/Applications/LatticeTerm.app'))
          if len(apps) != 1:
              raise SystemExit(f'Expected one unsigned device app, found {len(apps)}')
          result = subprocess.run(['python3', 'scripts/verify-ios-app.py', str(apps[0]), '--build-number', '1', '--require-store-sdk'], check=True, stdout=subprocess.PIPE, text=True)
          print(result.stdout)
          Path('src-tauri/gen/apple/build/reports/device.json').write_text(result.stdout)
          PY
      - name: Package verified unsigned bundles
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, platform, tarfile
          from pathlib import Path
          build = Path('src-tauri/gen/apple/build')
          output = build / 'reports'
          sources = {
              'ios-simulator.tar.gz': list(build.glob('*/LatticeTerm.app')),
              'ios-device-unsigned.tar.gz': list(build.glob('*.xcarchive')),
          }
          checksums = {}
          for name, paths in sources.items():
              if len(paths) != 1:
                  raise SystemExit(f'Expected one source for {name}, found {len(paths)}')
              artifact = output / name
              with tarfile.open(artifact, 'w:gz') as archive:
                  archive.add(paths[0], arcname=paths[0].name)
              with artifact.open('rb') as source:
                  digest = hashlib.sha256()
                  for chunk in iter(lambda: source.read(1024 * 1024), b''):
                      digest.update(chunk)
                  checksums[name] = digest.hexdigest()
          provenance = {
              'commit': os.environ['GITHUB_SHA'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'simulatorArchitecture': platform.machine(),
              'signedForDeviceInstallation': False,
              'sha256': checksums,
          }
          (output / 'provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          (output / 'README.txt').write_text(
              '模擬器 App 可安裝到相容架構的 iOS 模擬器。\n'
              '實機 archive 尚未簽章，不能直接安裝到 iPhone 或上傳 App Store Connect。\n'
              '請以 provenance.json 的 commit 與 SHA-256 對照來源及產物。\n'
          )
          PY
      - name: Save verified bundles and reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-unsigned-release-${{ github.sha }}
          path: src-tauri/gen/apple/build/reports
          if-no-files-found: error
          retention-days: 7
      - name: Save simulator bundle for requested native checks
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_interactions }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-native-simulator-${{ github.sha }}
          path: |
            src-tauri/gen/apple/build/reports/ios-simulator.tar.gz
            src-tauri/gen/apple/build/reports/provenance.json
          if-no-files-found: error
          retention-days: 7
      - name: Report verification boundaries
        if: always()
        shell: bash
        env:
          NATIVE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.native_interactions }}
        run: |
          echo '### iOS 驗證範圍' >> "$GITHUB_STEP_SUMMARY"
          echo '本 job 僅檢查建置與 bundle，未代表原生互動通過。' >> "$GITHUB_STEP_SUMMARY"
          if [ "$NATIVE_REQUESTED" = true ]; then
            echo '已要求三機互動；請另查原生互動 job 結果，建置成功後才會執行。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '本輪未執行三機原生互動；需要時請手動勾選 native_interactions。' >> "$GITHUB_STEP_SUMMARY"
          fi
      # This job deliberately creates no IPA, uses no Apple credentials,
      # and makes no TestFlight or App Store submission.

  native-interactions:
    name: iOS native interactions (on demand)
    needs: simulator
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_interactions }}
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select an installed Xcode 26 or newer
        shell: bash
        run: |
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          candidates = []
          for app in Path('/Applications').glob('Xcode*.app'):
              match = re.match(r'Xcode_(\d+)(?:\.(\d+))?(?:\.(\d+))?\.app$', app.name)
              if match and int(match[1]) >= 26:
                  candidates.append((tuple(int(part or 0) for part in match.groups()), app))
          if not candidates:
              raise SystemExit('Runner has no supported Xcode 26 installation')
          subprocess.run(['sudo', 'xcode-select', '-s', str(max(candidates)[1])], check=True)
          PY
          xcodebuild -version
      - name: Download this run's simulator bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "ios-native-simulator-${GITHUB_SHA}" --dir native-source/package
      - name: Verify simulator source and extract safely
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util, os, platform, subprocess
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('reuse', 'scripts/reuse-ios-simulator.py')
          reuse = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(reuse)
          run = {'head_sha': os.environ['GITHUB_SHA'], 'id': os.environ['GITHUB_RUN_ID'],
                 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT']}
          archive, provenance = reuse.verify_archive(Path('native-source/package'), run, platform.machine())
          app = reuse.extract_app(archive, Path('native-source/extracted'))
          subprocess.run(['python3', 'scripts/verify-ios-app.py', str(app), '--build-number', '1', '--require-declared-api'], check=True)
          PY
      - name: Prepare isolated keyboard and rotation checks
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
      - name: Capture isolated simulator layout evidence
        run: >-
          python3 scripts/ios-simulator-smoke.py native-source/extracted/LatticeTerm.app
          --output ios-layout-evidence --store-screenshots --layout-diagnostics --interaction-checks
      - name: Save original simulator layout evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-layout-evidence
          path: ios-layout-evidence
          if-no-files-found: ignore
      - name: Save simulator launch evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-simulator-launch-evidence
          path: ios-layout-evidence
          if-no-files-found: ignore
          retention-days: 14
