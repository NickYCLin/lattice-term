name: iOS signed release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "尚未上傳過的 Apple 建置號（例如 1 或 2）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-signed-release
  cancel-in-progress: false

jobs:
  archive:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    environment: ios-app-store
    env:
      BUILD_NUMBER: ${{ inputs.build_number }}
      APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: ios-signed-release
          cache-on-failure: true
      - name: Select Xcode 26 or newer
        shell: bash
        run: |
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          candidates = []
          for app in Path('/Applications').glob('Xcode*.app'):
              match = re.match(r'Xcode_(\d+)(?:\.(\d+))?(?:\.(\d+))?\.app$', app.name)
              if match and int(match[1]) >= 26:
                  candidates.append((tuple(int(p or 0) for p in match.groups()), app))
          if not candidates:
              raise SystemExit('Runner has no Xcode 26 installation')
          subprocess.run(['sudo', 'xcode-select', '-s', str(max(candidates)[1])], check=True)
          PY
          xcodebuild -version
      - run: npm ci
      - run: npm run ios:check
      - name: Install the App Store provisioning profile for Xcode
        env:
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, plistlib, re, subprocess, tempfile
          from pathlib import Path
          encoded = os.environ['IOS_MOBILE_PROVISION']
          content = base64.b64decode(encoded, validate=True)
          with tempfile.NamedTemporaryFile(suffix='.mobileprovision') as source:
              source.write(content)
              source.flush()
              profile = plistlib.loads(subprocess.check_output(['security', 'cms', '-D', '-i', source.name]))
          team = os.environ['APPLE_DEVELOPMENT_TEAM']
          assert profile['TeamIdentifier'] == [team], 'Wrong profile team'
          assert profile['Entitlements']['application-identifier'] == f'{team}.io.github.nickyclin.latticeterm', 'Wrong profile App ID'
          identifier = profile['UUID']
          assert re.fullmatch(r'[a-fA-F0-9-]{36}', identifier), 'Invalid profile UUID'
          # Xcode 16+ uses this location; Tauri 2.11.4 only installs to MobileDevice.
          destination = Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles'
          destination.mkdir(parents=True, exist_ok=True)
          target = destination / f'{identifier}.mobileprovision'
          with target.open('xb') as output:
              output.write(content)
          target.chmod(0o600)
          # Tauri silently ignores a failed profile UUID lookup. Bind the already
          # validated profile explicitly in this disposable runner checkout too.
          project = Path('src-tauri/gen/apple/lattice-term.xcodeproj/project.pbxproj')
          source = project.read_text()
          marker = 'CODE_SIGN_STYLE = Automatic;'
          assert source.count(marker) == 2, 'Unexpected iOS signing configurations'
          project.write_text(source.replace(marker, f'CODE_SIGN_STYLE = Manual;\n                PROVISIONING_PROFILE_SPECIFIER = "{identifier}";\n                "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]" = "{identifier}";'))
          print('Installed and bound the verified App Store provisioning profile.')
          PY
      - name: Build a signed App Store Connect IPA
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: npm run ios:build -- --build-number "$BUILD_NUMBER"
      - name: Verify the exported IPA and signing identity
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, plistlib, shutil, subprocess, tempfile
          from pathlib import Path
          packages = list(Path('src-tauri/gen/apple/build').rglob('*.ipa'))
          if len(packages) != 1:
              raise SystemExit(f'Expected one IPA, found {len(packages)}')
          output = Path('ios-release-artifacts')
          output.mkdir()
          team = os.environ['APPLE_DEVELOPMENT_TEAM']
          identifier = 'io.github.nickyclin.latticeterm'
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run(['ditto', '-x', '-k', str(packages[0]), directory], check=True)
              apps = list(Path(directory).glob('Payload/*.app'))
              if len(apps) != 1:
                  raise SystemExit('Expected one app in exported IPA')
              app = apps[0]
              report = subprocess.check_output(['python3', 'scripts/verify-ios-app.py', str(app), '--build-number', os.environ['BUILD_NUMBER'], '--require-store-sdk'], text=True)
              (output / 'bundle.json').write_text(report)
              subprocess.run(['codesign', '--verify', '--deep', '--strict', str(app)], check=True)
              entitlements = plistlib.loads(subprocess.check_output(['codesign', '-d', '--entitlements', ':-', str(app)], stderr=subprocess.DEVNULL))
              profile = plistlib.loads(subprocess.check_output(['security', 'cms', '-D', '-i', str(app / 'embedded.mobileprovision')]))
              assert entitlements.get('application-identifier') == f'{team}.{identifier}', 'Wrong signed app identifier'
              assert entitlements.get('com.apple.developer.team-identifier') == team, 'Wrong signing team'
              assert entitlements.get('get-task-allow', False) is False, 'Export permits debugging'
              assert profile['Entitlements'].get('application-identifier') == f'{team}.{identifier}', 'Wrong provisioning identifier'
              assert profile['TeamIdentifier'] == [team], 'Wrong provisioning team'
              assert profile['Entitlements'].get('get-task-allow') is False, 'Development profile'
              assert not profile.get('ProvisionedDevices') and not profile.get('ProvisionsAllDevices'), 'Not an App Store profile'
              assert profile['ExpirationDate'].replace(tzinfo=datetime.timezone.utc) > datetime.datetime.now(datetime.timezone.utc), 'Expired provisioning profile'
              certificate_prefix = str(Path(directory) / 'signer-')
              subprocess.run(['codesign', '-d', f'--extract-certificates={certificate_prefix}', str(app)], check=True)
              assert Path(certificate_prefix + '0').read_bytes() in profile['DeveloperCertificates'], 'Signer is not in provisioning profile'
          shutil.copyfile(packages[0], output / 'LatticeTerm.ipa')
          (output / 'provenance.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'],
              'buildNumber': os.environ['BUILD_NUMBER'], 'uploadedToApple': False,
              'sha256': hashlib.sha256(packages[0].read_bytes()).hexdigest(),
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-signed-release-${{ github.sha }}-${{ inputs.build_number }}
          path: ios-release-artifacts
          if-no-files-found: error
          retention-days: 7
      # Only exports a signed IPA. Upload and TestFlight distribution are separate.
