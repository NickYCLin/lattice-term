name: Recover failed release builds

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: release-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-build:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run has write permission. Read only trusted default-branch code,
      # never the triggering run's checkout, artifacts, or cache.
      - name: Check out trusted recovery code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Allow the download service to recover
        run: sleep 60

      - name: Retry only failed desktop builds within the attempt limit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { retryRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/retry-release.mjs`);
            await retryRelease({ github, context, core });
