name: Windows test installer

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-test-installer.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-*.mjs"
      - "scripts/verify-mcp-windows.mjs"
      - "scripts/verify-windows-lib-tests.ps1"
      - "scripts/verify-windows-lib-tests.test.mjs"
      - "scripts/windows-lib-test.manifest"
      - "src/**"
      - "src-tauri/**"
      - "crates/lattice-remote/**"
      - "crates/lattice-rdp/**"
      - "crates/lattice-vnc/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-test-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows amd64 test installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          workspaces: |
            src-tauri -> target
            crates/lattice-remote -> target
            crates/lattice-rdp -> target
            crates/lattice-vnc -> target

      - name: Install frontend dependencies
        run: npm ci

      # Test installers are intentionally unsigned and never published as a
      # GitHub Release. They also stay endpoint-agnostic: the user enters the
      # current wss:// relay URL in the app, so a Quick Tunnel restart does not
      # require rebuilding or reinstalling LatticeTerm.
      # Inline JSON does not survive pwsh -> npx.cmd argument re-quoting on
      # Windows (the quotes get stripped and Tauri rejects the config), so the
      # override is handed over as a file instead.
      - name: Build unsigned NSIS installer
        id: build_installer
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP "tauri-test-installer.json"
          '{"bundle":{"createUpdaterArtifacts":false}}' | Out-File $config -Encoding ascii
          npx tauri build --bundles nsis --no-sign --ci --config $config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify MCP through Windows named pipes and ConPTY
        run: node scripts/verify-mcp-windows.mjs src-tauri/target/release/lattice-term.exe mcp-windows-report.json --external-reporter

      - name: Verify remote text protocol and Windows host safety boundary
        shell: pwsh
        run: |
          cargo test --manifest-path crates/lattice-remote/Cargo.toml --features agent --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path crates/lattice-remote/Cargo.toml --features agent --bin lattice-agent windows_text_requests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path crates/lattice-remote/Cargo.toml --features agent --test commands_e2e
          cargo test --manifest-path crates/lattice-remote/Cargo.toml --features agent --test chat_e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native regression runner contracts
        shell: pwsh
        run: ./scripts/verify-windows-lib-tests.ps1 -SelfTest

      - name: Verify Windows library regressions
        shell: pwsh
        run: ./scripts/verify-windows-lib-tests.ps1

      - name: Upload Windows native regression report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LatticeTerm-Windows-native-regressions
          path: windows-native-tests-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows MCP acceptance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LatticeTerm-Windows-MCP-acceptance
          path: mcp-windows-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify installer output
        if: always() && steps.build_installer.outcome == 'success'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Tauri did not produce an NSIS installer." }
          Get-FileHash -Algorithm SHA256 $installer.FullName

      - name: Upload Windows installer
        if: always() && steps.build_installer.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LatticeTerm-Windows-amd64-test
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
